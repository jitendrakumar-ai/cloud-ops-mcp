<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="100%" stop-color="#150d2a"/>
    </linearGradient>
    <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#9d4edd"/>
    </linearGradient>
    <linearGradient id="prism-face1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#482683" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="prism-face2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00dfd8" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="360" rx="16" fill="url(#bg)"/>

  <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" stroke="#1f2442" stroke-width="0.8" opacity="0.4"/>
  <path d="M200 0 V360 M400 0 V360 M600 0 V360 M800 0 V360 M1000 0 V360" stroke="#1f2442" stroke-width="0.8" opacity="0.4"/>

  <circle cx="220" cy="180" r="120" fill="#00f2fe" opacity="0.12" filter="url(#glow)"/>

  <g transform="translate(140, 95)">
    <polygon points="80,10 140,45 80,80 20,45" fill="url(#cyan-violet)" opacity="0.95" />
    <polygon points="20,45 80,80 80,150 20,115" fill="url(#prism-face1)" />
    <polygon points="80,80 140,45 140,115 80,150" fill="url(#prism-face2)" />
    <polyline points="80,10 80,80 80,150" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <polyline points="20,45 80,80 140,45" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <polygon points="80,10 140,45 140,115 80,150 20,115 20,45" fill="none" stroke="#00f2fe" stroke-width="2" filter="url(#glow)"/>
  </g>

  <text x="360" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="2">cloud-ops-mcp</text>
  
  <text x="360" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="20" fill="#a0aec0" letter-spacing="1">Autonomous Cloud Operations &amp; Infrastructure • by NexusVibe AI</text>

  <rect x="360" y="240" width="480" height="4" rx="2" fill="url(#cyan-violet)"/>
</svg>
